<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dein Geschenk, Papa!</title>
    <style>
        :root {
            --iron: #333;
            --fire: #ff4500;
            --coal: #1a1a1a;
        }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #2c3e50, #000);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* GESCHENK-BOX ANIMATION */
        #gift-box {
            font-size: 150px;
            cursor: pointer;
            transition: transform 0.2s;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-30px) rotate(5deg);}
            60% {transform: translateY(-15px) rotate(-5deg);}
        }

        /* DER GRILL (Zuerst unsichtbar) */
        #grill-stage {
            display: none;
            text-align: center;
        }

        .grill-body {
            width: 200px;
            height: 100px;
            background: var(--iron);
            border-radius: 0 0 100px 100px;
            position: relative;
            margin: 0 auto;
            border-top: 5px solid #555;
        }

        .grill-legs {
            width: 10px;
            height: 80px;
            background: var(--iron);
            margin: 0 auto;
            position: relative;
        }
        .grill-legs::before, .grill-legs::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 80px;
            background: var(--iron);
            top: 0;
        }
        .grill-legs::before { transform: rotate(20deg); left: -30px; }
        .grill-legs::after { transform: rotate(-20deg); right: -30px; }

        /* FEUER ANIMATION */
        .fire-container {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
        }
        .flame {
            width: 15px;
            height: 30px;
            background: var(--fire);
            border-radius: 50% 50% 20% 20%;
            animation: flicker 0.5s infinite alternate;
        }
        @keyframes flicker {
            0% { transform: scaleY(1); opacity: 0.8; }
            100% { transform: scaleY(1.5); opacity: 1; filter: blur(2px); }
        }

        .steak {
            font-size: 40px;
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            animation: sizzle 0.2s infinite;
        }
        @keyframes sizzle {
            0% { transform: translateX(-52%) translateY(1px); }
            100% { transform: translateX(-48%) translateY(-1px); }
        }

        h1 { margin-top: 50px; font-size: 2.5rem; text-shadow: 0 0 10px var(--fire); }
    </style>
</head>
<body>

    <div id="gift-box" onclick="revealGift()">🎁</div>

    <div id="grill-stage">
        <div class="grill-body">
            <div class="fire-container">
                <div class="flame" style="animation-delay: 0.1s"></div>
                <div class="flame" style="animation-delay: 0.3s; background: #ff8c00; height: 45px;"></div>
                <div class="flame" style="animation-delay: 0.2s"></div>
            </div>
            <div class="steak">🥩</div>
        </div>
        <div class="grill-legs"></div>
        <h1>Gutschein: Grillabend Deluxe!</h1>
        <p>Alles Gute zum Geburtstag, Chef am Rost!</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        function revealGift() {
            document.getElementById('gift-box').style.display = 'none';
            document.getElementById('grill-stage').style.display = 'block';
            
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff4500', '#ffffff', '#ff8c00']
            });
        }
    </script>
</body>
</html>
